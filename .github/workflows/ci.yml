name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Presupuesto de rendimiento — brief §3.4: si el First Load JS
      # supera 130 KB, el build falla.
      - name: Presupuesto de bundle
        run: node scripts/check-bundle-budget.mjs
        env:
          BUNDLE_BUDGET_KB: 130
